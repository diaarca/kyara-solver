[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kyara-collector"
version = "0.1.0"
requires-python = ">=3.11"
description = "Read-only, resumable Kyara dataset collector"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
scrap = "kyara.collector:main"

[tool.setuptools.packages.find]
where = ["python"]
